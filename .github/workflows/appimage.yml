#
# Build the AppImage on every push/PR (uploaded as a workflow artifact), and
# publish it to a GitHub Release when a v* tag is pushed.
#
# The app uses libadwaita 1.6 APIs (AdwSpinner), which the apt-based Ubuntu
# runners don't ship, so the build runs inside an Arch Linux container (rolling,
# always current — matching the project's dev distro). This sets the AppImage's
# glibc baseline to Arch's current glibc, so it targets recent/rolling distros.
# The build script also builds the newest lgogdownloader release into it.
name: AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default: the build runs downloaded packaging tools, so it
# gets no write token. Only the release job below may write.
permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel meson ninja pkgconf \
            gtk4 libadwaita json-c \
            patchelf desktop-file-utils librsvg webp-pixbuf-loader \
            squashfs-tools wget git github-cli file python \
            cmake boost jsoncpp rhash tinyxml2 tidy curl zlib \
            webkitgtk-6.0 licenses
          # A clean container has no populated GdkPixbuf loader dir (recent
          # librsvg ships no pixbuf loader); the linuxdeploy gtk plugin requires
          # it. Installing a real loader above + regenerating the cache creates
          # /usr/lib/gdk-pixbuf-2.0/2.10.0/{loaders,loaders.cache}.
          gdk-pixbuf-query-loaders --update-cache

      - uses: actions/checkout@v7

      # The build asks GitHub for the newest lgogdownloader release at most
      # once a day: the answer (and the source tarball) is cached per day.
      - name: Today's date
        id: today
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache the lgogdownloader lookup
        uses: actions/cache@v6
        with:
          path: |
            .appimage-tools/lgogdownloader-latest
            .appimage-tools/lgogdownloader-*.tar.gz
          key: lgogdownloader-${{ steps.today.outputs.date }}

      - name: Build AppImage
        run: ./packaging/build-appimage.sh

      - name: Generate checksum
        run: sha256sum gog-manager-x86_64.AppImage | tee gog-manager-x86_64.AppImage.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: gog-manager-x86_64-AppImage
          path: |
            gog-manager-x86_64.AppImage
            gog-manager-x86_64.AppImage.sha256
          if-no-files-found: error

  release:
    # Publishing needs write access; it runs only for v* tags and only
    # downloads the AppImage the build job made.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Only CHANGELOG.md, for the release notes.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        with:
          name: gog-manager-x86_64-AppImage

      # The release page shows this version's section of CHANGELOG.md (from
      # its "## [X.Y.Z]" heading to the next one); a tag without one stops
      # here rather than publishing a release with no notes.
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "error: CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          prev="$(grep -o "^\[$version\]: .*" CHANGELOG.md | cut -d' ' -f2- || true)"
          [ -n "$prev" ] && printf '\n**Full changes:** %s\n' "$prev" >> release-notes.md
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="gog-manager-x86_64.AppImage gog-manager-x86_64.AppImage.sha256"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $assets --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "GOG Manager $GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              $assets
          fi
