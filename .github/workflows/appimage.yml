#
# Build the AppImage on every push/PR (uploaded as a workflow artifact), and
# publish it to a GitHub Release when a v* tag is pushed.
name: AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Needed for `gh release create` to attach assets.
permissions:
  contents: write

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # ubuntu-24.04 ships GTK 4.14 + libadwaita 1.5, which the app requires
    # (AdwDialog / AdwAboutDialog). Note: this sets the AppImage's glibc
    # baseline to 2.39, so it runs on glibc >= 2.39 distros.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libjson-c-dev \
            patchelf desktop-file-utils librsvg2-common \
            gtk-update-icon-cache file

      - name: Build AppImage
        run: ./packaging/build-appimage.sh

      - name: Generate checksum
        run: sha256sum gog-manager-x86_64.AppImage | tee gog-manager-x86_64.AppImage.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gog-manager-x86_64-AppImage
          path: |
            gog-manager-x86_64.AppImage
            gog-manager-x86_64.AppImage.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="gog-manager-x86_64.AppImage gog-manager-x86_64.AppImage.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $assets --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "GOG Manager $GITHUB_REF_NAME" \
              --generate-notes \
              $assets
          fi
